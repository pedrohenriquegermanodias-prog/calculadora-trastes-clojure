<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Calculador de Trastes</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <div class="container">

        <h1> Calculadora de Trastes</h1>
        <p class="subtitle">

Precisão para músicos e luthiers

</p>

        <div class="card">

            <label>
                Escala do instrumento (mm)
            </label>

            <input
                id="escala"
                type="number"
                placeholder="Ex: 650">

            <label>
                Instrumento
            </label>

            <select id="instrumento">

                <option value="20">
                    Violão (20)
                </option>

                <option value="22">
                    Guitarra (22)
                </option>

                <option value="24">
                    Guitarra Moderna (24)
                </option>

                <option value="0">
                    Personalizado
                </option>

            </select>

            <input
                id="custom"
                type="number"
                placeholder="Quantidade personalizada"
                style="display:none;">

            <button
                onclick="calcular()">

                CALCULAR

            </button>

        </div>

        <div
            id="resultado">

        </div>

    </div>

<script src="script.js"></script>

</body>

</html>
